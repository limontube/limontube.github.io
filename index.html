<html lang="tr">

<script
    src="https://accounts.google.com/gsi/client"

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #222;
}

.container {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.header {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);

}

.header h1 {

}

.header p {
    margin: 0 0 18px;
    color: #666;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

button,
.youtube-button {
    border: none;
    padding: 11px 18px;

    font-weight: bold;

    display: inline-block;
}

.channel-button {
    background: #ff0000;
    color: white;
}

.refresh-button {
    background: #222;
    color: white;
}

.login-button {
    background: #4285f4;
    color: white;
}

.logout-button {
    background: #e8e8e8;
    color: #222;
}

.search-box {
    width: 100%;
    padding: 13px 16px;
    margin-top: 18px;
    border: 1px solid #ddd;

}

.search-box:focus {

#status {
    text-align: center;

.user-info {

}

.videos {

.video-card:hover {

.thumbnail {

}

.video-content {

}

.video-title {

.video-date {

}

.video-buttons {

}

.watch-button {

}

.youtube-button {
    background: #ff0000;
    color: white;
}

.like-button {

}

}

    justify-content: center;

    padding: 15px;

}

.player-box {
    width: 100%;

    background: white;

}

.player-header {

}

.close-player {

}

.player-video {

}

.player-actions {

    flex-wrap: wrap;
}

.comments-section {

}

.comments-title {

}

.comment-form {

    gap: 10px;

}

.comment-input {

    border:

    border-radius: 10px;

}

.comment-submit {

}

.comment {

}

.comment-user {

}

}

}

.login-note {

    background: #f5f7fb;

    margin-bottom: 15px;

    color: #666;
}

.error {
    padding: 13px;

}

}

@media (max-width: 600px) {

    }

    .header h1 {
        font-size: 23px;
    }

    .videos {
        grid-template-columns: 1fr;
    }

    .comment-form {

        <p>

        <div class="buttons">

            <a

            </a>

            <button

<script>

/*
============================================================
AYARLAR
============================================================
*/


/*
    YENİ API KEY'İNİ BURAYA KOY.

    Daha önce paylaştığın anahtarı kullanma.
*/

const API_KEY =
    "AIzaSyAtpKHzGqF1_WGA1fS_2CmnNAVb7Mo0ZpQ";


/*
    YouTube kanal handle'ı
*/

const CHANNEL_HANDLE =
    "@LimonBoncukCicikus";


/*
    Google OAuth Client ID

    Client ID gizli değildir.
    client_secret BURAYA KOYULMAZ.
*/

const GOOGLE_CLIENT_ID =
    "748386770810-rae4e7u5ohtthimftign6ghmov87t0tq.apps.googleusercontent.com";


/*
    OAuth kapsamı.

    Yorum yazma ve video beğenme için gerekir.
*/

const YOUTUBE_SCOPE =
    "https://www.googleapis.com/auth/youtube.force-ssl";


/*
============================================================
GLOBAL DEĞİŞKENLER
============================================================
*/

let allVideos = [];

let accessToken = null;

let tokenClient = null;

let currentVideoId = null;


/*
============================================================
LOCAL STORAGE
============================================================
*/

/*
    Burada TOKEN saklamıyoruz.

    Sadece bu tarayıcıda kullanıcının daha önce
    Google yetkisi verdiğini belirten bilgi tutuluyor.
*/

const LOGIN_STORAGE_KEY =
    "limonboncuk_google_authorized";


function wasPreviouslyAuthorized() {

    return (
        localStorage.getItem(
            LOGIN_STORAGE_KEY
        ) === "true"
    );

}


function setPreviouslyAuthorized() {

    localStorage.setItem(
        LOGIN_STORAGE_KEY,
        "true"
    );

}


function clearAuthorizationMemory() {

    localStorage.removeItem(
        LOGIN_STORAGE_KEY
    );

}


/*
============================================================
GOOGLE IDENTITY SERVICES BAŞLAT
============================================================
*/

function initializeOAuth() {

    if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        setTimeout(
            initializeOAuth,
            300
        );

        return;

    }


    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                GOOGLE_CLIENT_ID,

            scope:
                YOUTUBE_SCOPE,

            callback:
                handleOAuthResponse

        });


    /*
        Kullanıcı daha önce giriş yaptıysa
        sessiz giriş deniyoruz.
    */

    if (
        wasPreviouslyAuthorized()
    ) {

        silentLogin();

    }

}


/*
============================================================
SESSİZ GİRİŞ
============================================================
*/

function silentLogin() {

    if (!tokenClient) {
        return;
    }


    /*
        prompt:none:

        Kullanıcı daha önce izin verdiyse
        izin ekranı göstermeden token istemeyi dener.

        Başarısız olursa kullanıcıya hata
        göstermiyoruz.
    */

    tokenClient.requestAccessToken({
        prompt: "none"
    });

}


/*
============================================================
MANUEL GİRİŞ
============================================================
*/

function manualLogin() {

    if (!tokenClient) {

        alert(
            "Google giriş sistemi hazırlanıyor. " +
            "Bir saniye sonra tekrar deneyin."
        );

        return;

    }


    tokenClient.requestAccessToken({
        prompt: "consent"
    });

}


/*
============================================================
OAUTH CEVABI
============================================================
*/

function handleOAuthResponse(
    response
) {

    console.log(
        "OAuth response:",
        response
    );


    /*
        Sessiz giriş başarısız olabilir.

        Bu durumda kullanıcıyı rahatsız etmiyoruz.
    */

    if (
        response.error ||
        !response.access_token
    ) {

        console.log(
            "Sessiz Google girişi başarısız:",
            response.error
        );

        accessToken = null;

        return;

    }


    /*
        TOKEN SADECE RAM'DE TUTULUYOR.
    */

    accessToken =
        response.access_token;


    /*
        Daha önce başarılı giriş yapıldığını
        localStorage'ye kaydediyoruz.
    */

    setPreviouslyAuthorized();


    updateLoginUI();


    /*
        Kullanıcı video penceresini açmışsa
        yorumları yeniden yükle.
    */

    if (currentVideoId) {

        loadComments(
            currentVideoId
        );

    }

}


/*
============================================================
GİRİŞ ARAYÜZÜ
============================================================
*/

function updateLoginUI() {

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const logoutButton =
        document.getElementById(
            "logoutButton"
        );

    const userInfo =
        document.getElementById(
            "userInfo"
        );


    if (accessToken) {

        loginButton.style.display =
            "none";

        logoutButton.style.display =
            "inline-block";

        userInfo.textContent =
            "✅ Google hesabıyla giriş yapıldı.";

    }
    else {

        loginButton.style.display =
            "inline-block";

        logoutButton.style.display =
            "none";

        userInfo.textContent =
            "";

    }

}


/*
============================================================
ÇIKIŞ
============================================================
*/

function logout() {

    if (
        accessToken &&
        typeof google !== "undefined" &&
        google.accounts &&
        google.accounts.oauth2
    ) {

        google.accounts.oauth2.revoke(
            accessToken,
            () => {

                console.log(
                    "Google yetkisi iptal edildi."
                );

            }
        );

    }


    accessToken = null;


    /*
        Otomatik giriş bilgisini de siliyoruz.
    */

    clearAuthorizationMemory();


    updateLoginUI();

}


/*
============================================================
YETKİLİ API İSTEĞİ
============================================================
*/

async function authorizedFetch(
    url,
    options = {}
) {

    if (!accessToken) {

        throw new Error(
            "AUTH_REQUIRED"
        );

    }


    const headers = {

        ...(options.headers || {}),

        Authorization:
            "Bearer " +
            accessToken

    };


    /*
        GET isteklerinde Content-Type
        zorunlu değil.

        POST işlemlerinde ekleniyor.
    */

    if (
        options.body !== undefined
    ) {

        headers[
            "Content-Type"
        ] =
            "application/json";

    }


    return fetch(
        url,
        {
            ...options,
            headers
        }
    );

}


/*
============================================================
KANAL BİLGİSİ
============================================================
*/

async function getChannel() {

    const url =
        "https://www.googleapis.com/youtube/v3/channels" +
        "?part=contentDetails,snippet" +
        "&forHandle=" +
        encodeURIComponent(
            CHANNEL_HANDLE
        ) +
        "&key=" +
        encodeURIComponent(
            API_KEY
        );


    const response =
        await fetch(url);


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data?.error?.message ||
            "Kanal bilgisi alınamadı. HTTP " +
            response.status
        );

    }


    if (
        !data.items ||
        data.items.length === 0
    ) {

        throw new Error(
            "Kanal bulunamadı."
        );

    }


    return data.items[0];

}


/*
============================================================
TÜM VİDEOLARI AL
============================================================
*/

async function getAllVideos(
    uploadPlaylistId
) {

    let videos = [];

    let nextPageToken = "";


    do {

        let url =
            "https://www.googleapis.com/youtube/v3/playlistItems" +
            "?part=snippet,contentDetails" +
            "&playlistId=" +
            encodeURIComponent(
                uploadPlaylistId
            ) +
            "&maxResults=50" +
            "&key=" +
            encodeURIComponent(
                API_KEY
            );


        if (nextPageToken) {

            url +=
                "&pageToken=" +
                encodeURIComponent(
                    nextPageToken
                );

        }


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                "Videolar alınamadı. HTTP " +
                response.status
            );

        }


        if (data.items) {

            data.items.forEach(
                item => {

                    if (
                        item.snippet &&
                        item.contentDetails &&
                        item.contentDetails.videoId
                    ) {

                        videos.push({

                            id:
                                item.contentDetails.videoId,

                            title:
                                item.snippet.title,

                            description:
                                item.snippet.description,

                            date:
                                item.snippet.publishedAt,

                            thumbnail:

                                item.snippet
                                    .thumbnails
                                    ?.high
                                    ?.url ||

                                item.snippet
                                    .thumbnails
                                    ?.medium
                                    ?.url ||

                                item.snippet
                                    .thumbnails
                                    ?.default
                                    ?.url

                        });

                    }

                }
            );

        }


        nextPageToken =
            data.nextPageToken || "";


    }
    while (nextPageToken);


    return videos;

}


/*
============================================================
VİDEOLARI GÖSTER
============================================================
*/

function renderVideos(
    videos
) {

    const container =
        document.getElementById(
            "videos"
        );


    container.innerHTML = "";


    if (!videos.length) {

        container.innerHTML = `
            <div class="empty">
                Gösterilecek video bulunamadı.
            </div>
        `;

        return;

    }


    videos.forEach(
        video => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "video-card";


            const date =
                new Date(
                    video.date
                ).toLocaleDateString(
                    "tr-TR",
                    {
                        year: "numeric",
                        month: "long",
                        day: "numeric"
                    }
                );


            card.innerHTML = `

                <img
                    class="thumbnail"
                    src="${escapeHtml(
                        video.thumbnail
                    )}"
                    alt="${escapeHtml(
                        video.title
                    )}"
                    loading="lazy">


                <div class="video-content">

                    <div class="video-title">

                        ${escapeHtml(
                            video.title
                        )}

                    </div>


                    <div class="video-date">

                        📅 ${date}

                    </div>


                    <div class="video-buttons">

                        <button
                            class="watch-button"
                            onclick="openPlayer('${video.id}')">

                            ▶️ Sitede İzle

                        </button>


                        <button
                            class="like-button"
                            onclick="likeVideo('${video.id}')">

                            ❤️ Beğen

                        </button>


                        <a
                            class="youtube-button"
                            href="https://www.youtube.com/watch?v=${video.id}"
                            target="_blank"
                            rel="noopener">

                            🔴 YouTube

                        </a>

                    </div>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/*
============================================================
VİDEO OYNATICI
============================================================
*/

function openPlayer(
    videoId
) {

    currentVideoId =
        videoId;


    const video =
        allVideos.find(
            item =>
                item.id ===
                videoId
        );


    const overlay =
        document.createElement(
            "div"
        );


    overlay.className =
        "player-overlay";


    overlay.innerHTML = `

        <div class="player-box">

            <div class="player-header">

                <span>
                    ${escapeHtml(
                        video?.title ||
                        "Video"
                    )}
                </span>


                <button
                    class="close-player"
                    onclick="closePlayer()">

                    ×

                </button>

            </div>


            <div class="player-video">

                <iframe
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1"
                    allow="
                        autoplay;
                        encrypted-media;
                        picture-in-picture;
                        fullscreen
                    "
                    allowfullscreen>
                </iframe>

            </div>


            <div class="player-actions">

                <button
                    class="like-button"
                    onclick="likeVideo('${videoId}')">

                    ❤️ Videoyu Beğen

                </button>


                <a
                    class="youtube-button"
                    href="https://www.youtube.com/watch?v=${videoId}"
                    target="_blank"
                    rel="noopener">

                    🔴 YouTube'da Aç

                </a>

            </div>


            <div class="comments-section">

                <div class="comments-title">

                    💬 Yorumlar

                </div>


                <div id="commentArea">

                    <div class="loading">

                        Yorumlar yükleniyor...

                    </div>

                </div>

            </div>

        </div>

    `;


    document.body.appendChild(
        overlay
    );


    loadComments(
        videoId
    );

}


/*
============================================================
PLAYER KAPAT
============================================================
*/

function closePlayer() {

    const overlay =
        document.querySelector(
            ".player-overlay"
        );


    if (overlay) {

        overlay.remove();

    }


    currentVideoId =
        null;

}


/*
============================================================
YORUMLARI AL
============================================================
*/

async function loadComments(
    videoId
) {

    const area =
        document.getElementById(
            "commentArea"
        );


    if (!area) {
        return;
    }


    try {

        const url =
            "https://www.googleapis.com/youtube/v3/commentThreads" +
            "?part=snippet" +
            "&videoId=" +
            encodeURIComponent(
                videoId
            ) +
            "&maxResults=20" +
            "&textFormat=plainText" +
            "&order=relevance" +
            "&key=" +
            encodeURIComponent(
                API_KEY
            );


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                "Yorumlar alınamadı."
            );

        }


        renderComments(
            videoId,
            data.items || []
        );

    }
    catch (error) {

        console.error(error);


        area.innerHTML = `

            <div class="error">

                Yorumlar yüklenemedi.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/*
============================================================
YORUMLARI GÖSTER
============================================================
*/

function renderComments(
    videoId,
    comments
) {

    const area =
        document.getElementById(
            "commentArea"
        );


    if (!area) {
        return;
    }


    let html = "";


    if (accessToken) {

        html += `

            <div class="comment-form">

                <textarea
                    id="commentInput"
                    class="comment-input"
                    placeholder="Yorumunu yaz...">
                </textarea>


                <button
                    class="comment-submit"
                    onclick="sendComment('${videoId}')">

                    Gönder

                </button>

            </div>

        `;

    }
    else {

        html += `

            <div class="login-note">

                💬 Yorum yazmak veya ❤️ beğenmek
                için Google hesabınla giriş yap.

                <br><br>

                <button
                    class="login-button"
                    onclick="manualLogin()">

                    🔐 Google ile Giriş

                </button>

            </div>

        `;

    }


    if (!comments.length) {

        html += `

            <div class="empty">

                Henüz gösterilecek yorum yok.

            </div>

        `;

    }
    else {

        comments.forEach(
            thread => {

                const snippet =
                    thread
                        ?.snippet
                        ?.topLevelComment
                        ?.snippet;


                if (!snippet) {
                    return;
                }


                html += `

                    <div class="comment">

                        <div class="comment-user">

                            ${escapeHtml(
                                snippet
                                    .authorDisplayName
                            )}

                        </div>


                        <div class="comment-text">

                            ${escapeHtml(
                                snippet
                                    .textDisplay ||
                                snippet
                                    .textOriginal ||
                                ""
                            )}

                        </div>


                        <div class="comment-date">

                            ${new Date(
                                snippet
                                    .publishedAt
                            ).toLocaleString(
                                "tr-TR"
                            )}

                        </div>

                    </div>

                `;

            }
        );

    }


    area.innerHTML =
        html;

}


/*
============================================================
YORUM GÖNDER
============================================================
*/

async function sendComment(
    videoId
) {

    if (!accessToken) {

        manualLogin();

        return;

    }


    const input =
        document.getElementById(
            "commentInput"
        );


    if (!input) {
        return;
    }


    const text =
        input.value.trim();


    if (!text) {

        alert(
            "Yorum yazmalısın."
        );

        return;

    }


    try {

        const channel =
            await getChannel();


        const url =
            "https://www.googleapis.com/youtube/v3/commentThreads" +
            "?part=snippet";


        const body = {

            snippet: {

                channelId:
                    channel.id,

                videoId:
                    videoId,

                topLevelComment: {

                    snippet: {

                        textOriginal:
                            text

                    }

                }

            }

        };


        const response =
            await authorizedFetch(
                url,
                {
                    method: "POST",

                    body:
                        JSON.stringify(
                            body
                        )
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                "Yorum gönderilemedi."
            );

        }


        input.value = "";


        await loadComments(
            videoId
        );


    }
    catch (error) {

        console.error(error);


        if (
            error.message ===
            "AUTH_REQUIRED"
        ) {

            manualLogin();

            return;

        }


        alert(
            "Yorum gönderilemedi:\n\n" +
            error.message
        );

    }

}


/*
============================================================
VİDEOYU BEĞEN
============================================================
*/

async function likeVideo(
    videoId
) {

    if (!accessToken) {

        manualLogin();

        return;

    }


    try {

        const url =
            "https://www.googleapis.com/youtube/v3/videos/rate" +
            "?id=" +
            encodeURIComponent(
                videoId
            ) +
            "&rating=like";


        const response =
            await authorizedFetch(
                url,
                {
                    method: "POST"
                }
            );


        if (!response.ok) {

            const data =
                await response.json()
                    .catch(
                        () => null
                    );


            throw new Error(
                data?.error?.message ||
                "Video beğenilemedi."
            );

        }


        alert(
            "❤️ Video beğenildi!"
        );

    }
    catch (error) {

        console.error(error);


        if (
            error.message ===
            "AUTH_REQUIRED"
        ) {

            manualLogin();

            return;

        }


        alert(
            "Video beğenilemedi:\n\n" +
            error.message
        );

    }

}


/*
============================================================
ARAMA
============================================================
*/

function filterVideos() {

    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    if (!search) {

        renderVideos(
            allVideos
        );

        return;

    }


    const filtered =
        allVideos.filter(
            video =>
                video.title
                    .toLowerCase()
                    .includes(
                        search
                    )
        );


    renderVideos(
        filtered
    );

}


/*
============================================================
HTML GÜVENLİĞİ
============================================================
*/

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text ?? "";


    return div.innerHTML;

}


/*
============================================================
VİDEOLARI YÜKLE
============================================================
*/

async function loadVideos(
    showLoading = true
) {

    const status =
        document.getElementById(
            "status"
        );


    try {

        if (showLoading) {

            status.textContent =
                "⏳ Videolar yükleniyor...";

        }


        const channel =
            await getChannel();


        const uploadsPlaylist =
            channel
                .contentDetails
                .relatedPlaylists
                .uploads;


        allVideos =
            await getAllVideos(
                uploadsPlaylist
            );


        renderVideos(
            allVideos
        );


        status.textContent =
            `✅ ${allVideos.length} video bulundu`;

    }
    catch (error) {

        console.error(error);


        status.innerHTML = `

            ❌ Videolar yüklenemedi.

            <br><br>

            <small>
                ${escapeHtml(
                    error.message
                )}
            </small>

        `;

    }

}
