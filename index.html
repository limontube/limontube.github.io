<html lang="tr">
<head>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #222;
}

.container {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.header {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    text-align: center;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.header p {
    margin: 0 0 18px;

}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;

}

button,
.youtube-button,
.login-button {
    border: none;

}

.channel-button {

}

.refresh-button {

    color: white;
}

.login-button {

.logout-button {

}

.search-box {

}

    text-align: center;
    margin: 20px 0;

}

.videos {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

.video-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow:
        0 5px 18px rgba(0,0,0,0.08);

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}

.video-card:hover {
    transform: translateY(-4px);

    box-shadow:
        0 10px 25px rgba(0,0,0,0.12);
}

.thumbnail {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;

}

.video-content {

}

.video-title {
    font-size: 16px;

.video-date {

.video-buttons {

    flex-wrap: wrap;
}

.watch-button {
    background: #111;

}

.youtube-button {
    background: #ff0000;
    color: white;
}

.like-button {
    background: #ffecec;

}

    text-align: center;

    padding: 30px;

    color: #777;
}

.player-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    overflow-y: auto;
}

.player-box {
    width: 100%;
    max-width: 1000px;
    background: white;
    border-radius: 15px;
    overflow: hidden;
}

.player-header {
    padding: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.close-player {
    border: none;
    background: #eee;
    color: #222;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
}

.player-video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
}

.player-video iframe {
    position: absolute;
    inset: 0;

}

.player-actions {
    padding: 15px;
    display: flex;

    flex-wrap: wrap;
}

.comments-section {

    border-top: 1px solid #eee;
}

.comments-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.comment-form {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.comment-input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    resize: vertical;
    min-height: 45px;
    font-family: inherit;
}

.comment-submit {
    background: #222;
    color: white;
    align-self: flex-end;
}

.comment {
    border-bottom: 1px solid #eee;
    padding: 14px 0;
}

.comment-user {
    font-weight: bold;
    margin-bottom: 5px;
}

.comment-text {
    white-space: pre-wrap;
    color: #444;
}

.comment-date {
    color: #888;
    font-size: 12px;
    margin-top: 5px;
}

.login-note {
    padding: 12px;
    background: #f5f7fb;
    border-radius: 10px;
    margin-bottom: 15px;
    color: #666;
}

.user-info {
    margin-top: 10px;
    font-size: 13px;
    color: #666;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #777;
}

.error {
    background: #ffecec;
    color: #b00020;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
}

@media (max-width: 600px) {

    .container {
        padding: 12px;
    }

    .header h1 {
        font-size: 23px;
    }

    .videos {
        grid-template-columns: 1fr;
    }

    .comment-form {
        flex-direction: column;
    }

    .comment-submit {
        align-self: stretch;
    }

}

</style>

<body>

<div class="container">

    <div class="header">

        <h1>🐦 Limon Boncuk</h1>

        <p>YouTube kanalındaki videolar</p>

        <div class="buttons">

            <a
                class="youtube-button channel-button"
                href="https://www.youtube.com/@LimonBoncukCicikus"
                target="_blank"
                rel="noopener">
                📺 Kanala Git
            </a>

            <button
                class="refresh-button"
                onclick="loadVideos(true)">
                🔄 Yenile
            </button>

            <button
                id="loginButton"

                🔐 Google ile Giriş
            </button>

                id="logoutButton"
                class="logout-button"
                onclick="logout()"
                style="display:none;">
                Çıkış
            </button>

        <div

        <input

    </div>

        id="videos"
        class="videos">
    </div>

</div>

<script>

/*
============================================================
API AYARLARI
============================================================
*/

/*
  BURAYA YENİ VE KISITLANMIŞ API KEY'İNİ KOY.

  Eskisini kullanma.
*/

const API_KEY =
    "AIzaSyAtpKHzGqF1_WGA1fS_2CmnNAVb7Mo0ZpQ";


const CHANNEL_HANDLE =
    "@LimonBoncukCicikus";


const CHANNEL_URL =
    "https://www.youtube.com/@LimonBoncukCicikus";


/*
============================================================
GOOGLE OAUTH
============================================================
*/

/*
  Client ID gizli değildir.
  client_secret BURAYA YAZILMAZ.
*/

const GOOGLE_CLIENT_ID =
    "748386770810-rae4e7u5ohtthimftign6ghmov87t0tq.apps.googleusercontent.com";


/*
  YouTube yorum ve beğeni işlemleri için gerekli scope.
*/

const YOUTUBE_SCOPE =
    "https://www.googleapis.com/auth/youtube.force-ssl";


let tokenClient = null;

let accessToken = null;

let currentVideoId = null;

let allVideos = [];


/*
============================================================
GOOGLE OAUTH CLIENT BAŞLAT
============================================================
*/

function initializeOAuth() {

    if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        setTimeout(
            initializeOAuth,
            500
        );

        return;
    }

    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                GOOGLE_CLIENT_ID,

            scope:
                YOUTUBE_SCOPE,

            callback:
                handleOAuthResponse

        });

}


/*
============================================================
GİRİŞ
============================================================
*/

function login() {

    if (!tokenClient) {

        alert(
            "Google giriş sistemi henüz hazır değil. " +
            "Sayfayı yenileyip tekrar deneyin."
        );

        return;
    }

    tokenClient.requestAccessToken({
        prompt: "consent"
    });

}


/*
============================================================
OAUTH CEVABI
============================================================
*/

function handleOAuthResponse(response) {

    if (
        response.error ||
        !response.access_token
    ) {

        console.error(
            "OAuth hatası:",
            response
        );

        alert(
            "Google hesabıyla giriş başarısız oldu."
        );

        return;
    }

    accessToken =
        response.access_token;

    document
        .getElementById("loginButton")
        .style.display = "none";

    document
        .getElementById("logoutButton")
        .style.display = "inline-block";

    document
        .getElementById("userInfo")
        .textContent =
        "✅ Google hesabıyla giriş yapıldı.";

}


/*
============================================================
ÇIKIŞ
============================================================
*/

function logout() {

    if (accessToken) {

        google.accounts.oauth2.revoke(
            accessToken
        );

    }

    accessToken = null;

    document
        .getElementById("loginButton")
        .style.display = "inline-block";

    document
        .getElementById("logoutButton")
        .style.display = "none";

    document
        .getElementById("userInfo")
        .textContent = "";

}


/*
============================================================
YETKİLİ YOUTUBE İSTEĞİ
============================================================
*/

async function authorizedFetch(
    url,
    options = {}
) {

    if (!accessToken) {

        throw new Error(
            "AUTH_REQUIRED"
        );

    }

    const headers = {

        ...(options.headers || {}),

        Authorization:
            "Bearer " + accessToken,

        "Content-Type":
            "application/json"

    };

    return fetch(
        url,
        {
            ...options,
            headers
        }
    );

}


/*
============================================================
KANAL BİLGİSİ
============================================================
*/

async function getChannel() {

    const url =
        "https://www.googleapis.com/youtube/v3/channels" +
        "?part=contentDetails,snippet" +
        "&forHandle=" +
        encodeURIComponent(CHANNEL_HANDLE) +
        "&key=" +
        encodeURIComponent(API_KEY);

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            "Kanal bilgisi alınamadı. HTTP " +
            response.status
        );

    }

    const data =
        await response.json();

    if (
        !data.items ||
        data.items.length === 0
    ) {

        throw new Error(
            "Kanal bulunamadı."
        );

    }

    return data.items[0];

}


/*
============================================================
TÜM VİDEOLAR
============================================================
*/

async function getAllVideos(
    uploadPlaylistId
) {

    let videos = [];

    let nextPageToken = "";

    do {

        let url =
            "https://www.googleapis.com/youtube/v3/playlistItems" +
            "?part=snippet,contentDetails" +
            "&playlistId=" +
            encodeURIComponent(uploadPlaylistId) +
            "&maxResults=50" +
            "&key=" +
            encodeURIComponent(API_KEY);

        if (nextPageToken) {

            url +=
                "&pageToken=" +
                encodeURIComponent(
                    nextPageToken
                );

        }

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                "Videolar alınamadı. HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if (data.items) {

            for (
                const item
                of data.items
            ) {

                if (
                    item.snippet &&
                    item.contentDetails &&
                    item.contentDetails.videoId
                ) {

                    videos.push({

                        id:
                            item.contentDetails.videoId,

                        title:
                            item.snippet.title,

                        description:
                            item.snippet.description,

                        date:
                            item.snippet.publishedAt,

                        thumbnail:

                            item.snippet
                                .thumbnails
                                ?.high
                                ?.url ||

                            item.snippet
                                .thumbnails
                                ?.medium
                                ?.url ||

                            item.snippet
                                .thumbnails
                                ?.default
                                ?.url

                    });

                }

            }

        }

        nextPageToken =
            data.nextPageToken || "";

    }
    while (nextPageToken);

    return videos;

}


/*
============================================================
VİDEOLAR GÖSTER
============================================================
*/

function renderVideos(videos) {

    const container =
        document.getElementById(
            "videos"
        );

    container.innerHTML = "";

    if (!videos.length) {

        container.innerHTML = `
            <div class="empty">
                Gösterilecek video bulunamadı.
            </div>
        `;

        return;
    }

    videos.forEach(video => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "video-card";

        const formattedDate =
            new Date(
                video.date
            ).toLocaleDateString(
                "tr-TR",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );

        card.innerHTML = `

            <img
                class="thumbnail"
                src="${escapeHtml(video.thumbnail)}"
                alt="${escapeHtml(video.title)}"
                loading="lazy">

            <div class="video-content">

                <div class="video-title">
                    ${escapeHtml(video.title)}
                </div>

                <div class="video-date">
                    📅 ${formattedDate}
                </div>

                <div class="video-buttons">

                    <button
                        class="watch-button"
                        onclick="openPlayer('${video.id}')">
                        ▶️ Sitede İzle
                    </button>

                    <button
                        class="like-button"
                        onclick="likeVideo('${video.id}')">
                        ❤️ Beğen
                    </button>

                    <a
                        class="youtube-button"
                        href="https://www.youtube.com/watch?v=${video.id}"
                        target="_blank"
                        rel="noopener">
                        🔴 YouTube
                    </a>

                </div>

            </div>
        `;

        container.appendChild(card);

    });

}


/*
============================================================
PLAYER
============================================================
*/

function openPlayer(
    videoId
) {

    currentVideoId =
        videoId;

    const video =
        allVideos.find(
            item =>
                item.id === videoId
        );

    const overlay =
        document.createElement(
            "div"
        );

    overlay.className =
        "player-overlay";

    overlay.innerHTML = `

        <div class="player-box">

            <div class="player-header">

                <span>
                    ${escapeHtml(
                        video?.title ||
                        "Video"
                    )}
                </span>

                <button
                    class="close-player"
                    onclick="closePlayer()">
                    ×
                </button>

            </div>


            <div class="player-video">

                <iframe
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1"
                    allow="
                        autoplay;
                        encrypted-media;
                        picture-in-picture;
                        fullscreen
                    "
                    allowfullscreen>
                </iframe>

            </div>


            <div class="player-actions">

                <button
                    class="like-button"
                    onclick="likeVideo('${videoId}')">
                    ❤️ Bu videoyu beğen
                </button>

                <a
                    class="youtube-button"
                    href="https://www.youtube.com/watch?v=${videoId}"
                    target="_blank"
                    rel="noopener">
                    🔴 YouTube'da aç
                </a>

            </div>


            <div class="comments-section">

                <div class="comments-title">
                    💬 Yorumlar
                </div>

                <div id="commentArea">

                    <div class="loading">
                        Yorumlar yükleniyor...
                    </div>

                </div>

            </div>

        </div>
    `;

    document.body.appendChild(
        overlay
    );

    loadComments(videoId);

}


/*
============================================================
PLAYER KAPAT
============================================================
*/

function closePlayer() {

    const overlay =
        document.querySelector(
            ".player-overlay"
        );

    if (overlay) {

        overlay.remove();

    }

    currentVideoId = null;

}


/*
============================================================
YORUMLARI GETİR
============================================================
*/

async function loadComments(
    videoId
) {

    const area =
        document.getElementById(
            "commentArea"
        );

    if (!area) {
        return;
    }

    try {

        const url =
            "https://www.googleapis.com/youtube/v3/commentThreads" +
            "?part=snippet" +
            "&videoId=" +
            encodeURIComponent(videoId) +
            "&maxResults=20" +
            "&textFormat=plainText" +
            "&order=relevance" +
            "&key=" +
            encodeURIComponent(API_KEY);

        const response =
            await fetch(url);

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                "Yorumlar alınamadı."
            );

        }

        renderComments(
            videoId,
            data.items || []
        );

    }
    catch (error) {

        console.error(error);

        area.innerHTML = `
            <div class="error">
                Yorumlar yüklenemedi.
                <br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;

    }

}


/*
============================================================
YORUMLARI GÖSTER
============================================================
*/

function renderComments(
    videoId,
    comments
) {

    const area =
        document.getElementById(
            "commentArea"
        );

    if (!area) {
        return;
    }

    let html = "";

    if (accessToken) {

        html += `

            <div class="comment-form">

                <textarea
                    id="commentInput"
                    class="comment-input"
                    placeholder="Yorumunu yaz...">
                </textarea>

                <button
                    class="comment-submit"
                    onclick="sendComment('${videoId}')">
                    Gönder
                </button>

            </div>

        `;

    }
    else {

        html += `

            <div class="login-note">

                💡 Yorum yapmak için
                Google hesabınla giriş yap.

                <br><br>

                <button
                    class="login-button"
                    onclick="login()">
                    🔐 Google ile Giriş
                </button>

            </div>

        `;

    }

    if (!comments.length) {

        html += `
            <div class="empty">
                Henüz gösterilecek yorum yok.
            </div>
        `;

    }
    else {

        comments.forEach(thread => {

            const snippet =
                thread
                    ?.snippet
                    ?.topLevelComment
                    ?.snippet;

            if (!snippet) {
                return;
            }

            html += `

                <div class="comment">

                    <div class="comment-user">

                        ${escapeHtml(
                            snippet
                                .authorDisplayName
                        )}

                    </div>

                    <div class="comment-text">

                        ${escapeHtml(
                            snippet
                                .textDisplay ||
                            snippet
                                .textOriginal ||
                            ""
                        )}

                    </div>

                    <div class="comment-date">

                        ${new Date(
                            snippet
                                .publishedAt
                        ).toLocaleString(
                            "tr-TR"
                        )}

                    </div>

                </div>

            `;

        });

    }

    area.innerHTML =
        html;

}


/*
============================================================
YORUM GÖNDER
============================================================
*/

async function sendComment(
    videoId
) {

    if (!accessToken) {

        login();

        return;

    }

    const input =
        document.getElementById(
            "commentInput"
        );

    if (!input) {
        return;
    }

    const text =
        input.value.trim();

    if (!text) {

        alert(
            "Yorum yazmalısın."
        );

        return;

    }

    try {

        const channel =
            await getChannel();

        const url =
            "https://www.googleapis.com/youtube/v3/commentThreads" +
            "?part=snippet";

        const body = {

            snippet: {

                channelId:
                    channel.id,

                videoId:
                    videoId,

                topLevelComment: {

                    snippet: {

                        textOriginal:
                            text

                    }

                }

            }

        };

        const response =
            await authorizedFetch(
                url,
                {
                    method: "POST",
                    body:
                        JSON.stringify(body)
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                "Yorum gönderilemedi."
            );

        }

        input.value = "";

        alert(
            "✅ Yorum gönderildi!"
        );

        loadComments(
            videoId
        );

    }
    catch (error) {

        console.error(error);

        if (
            error.message ===
            "AUTH_REQUIRED"
        ) {

            login();

            return;

        }

        alert(
            "Yorum gönderilemedi:\n\n" +
            error.message
        );

    }

}


/*
============================================================
VİDEOYU BEĞEN
============================================================
*/

async function likeVideo(
    videoId
) {

    if (!accessToken) {

        alert(
            "❤️ Beğenmek için önce Google hesabınla giriş yap."
        );

        login();

        return;

    }

    try {

        const url =
            "https://www.googleapis.com/youtube/v3/videos/rate" +
            "?id=" +
            encodeURIComponent(videoId) +
            "&rating=like";

        const response =
            await authorizedFetch(
                url,
                {
                    method: "POST",
                    body: undefined
                }
            );

        if (!response.ok) {

            let message =
                "Video beğenilemedi.";

            try {

                const data =
                    await response.json();

                message =
                    data?.error?.message ||
                    message;

            }
            catch {}

            throw new Error(
                message
            );

        }

        alert(
            "❤️ Video beğenildi!"
        );

    }
    catch (error) {

        console.error(error);

        alert(
            "Video beğenilemedi:\n\n" +
            error.message
        );

    }

}


/*
============================================================
ARAMA
============================================================
*/

function filterVideos() {

    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();

    if (!search) {

        renderVideos(
            allVideos
        );

        return;

    }

    const filtered =
        allVideos.filter(
            video =>
                video.title
                    .toLowerCase()
                    .includes(search)
        );

    renderVideos(
        filtered
    );

}


/*
============================================================
HTML ESCAPE
============================================================
*/

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/*
============================================================
ANA YÜKLEME
============================================================
*/

async function loadVideos(
    showLoading = true
) {

    const status =
        document.getElementById(
            "status"
        );

    try {

        if (showLoading) {

            status.innerHTML =
                "⏳ Videolar yükleniyor...";

        }

        const channel =
            await getChannel();

        const uploadsPlaylist =
            channel
                .contentDetails
                .relatedPlaylists
                .uploads;

        allVideos =
            await getAllVideos(
                uploadsPlaylist
            );

        renderVideos(
            allVideos
        );

        status.innerHTML =
            `✅ ${allVideos.length} video bulundu`;

    }
    catch (error) {

        console.error(error);

        status.innerHTML =
            `
                ❌ Videolar yüklenemedi.
                <br><br>
                <small>
                    ${escapeHtml(
                        error.message
                    )}
                </small>
            `;

    }

}


/*
============================================================
BAŞLAT
============================================================
*/

initializeOAuth();

loadVideos();

</script>
